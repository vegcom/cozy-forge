---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: \.md$
      - id: end-of-file-fixer
      - id: check-yaml
        args: ['--unsafe']
        exclude: \.sls$
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: trunk-chk
        name: Trunk Check & Format
        entry: trunk check --show-existing --index --fix --ci
        language: system
        stages: [pre-commit]
        pass_filenames: false
