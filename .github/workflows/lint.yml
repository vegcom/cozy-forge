name: Lint

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (pre-commit) (${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ['ubuntu-latest', 'macos-latest', 'windows-latest']
        python-version: ['3.11', '3.12']
    continue-on-error: ${{ matrix.os == 'windows-latest' }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Trunk
        uses: trunk-io/trunk-action/setup@v1

      - name: Add Trunk to PATH
        run: echo "$(dirname "$TRUNK_PATH")" >> $GITHUB_PATH
        shell: bash

      - name: Verify Trunk
        run: trunk --version
        shell: bash

      - name: Set up miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          environment-file: environment.yml
          activate-environment: cozy-forge
          auto-activate-base: false

      - name: Run pre-commit
        run: |
          FROM_REF="${{ github.event.pull_request.base.sha || github.event.before }}"

          if [ "$FROM_REF" = "0000000000000000000000000000000000000000" ]; then
            FROM_REF="HEAD~1"
          fi

          conda run -n cozy-forge pre-commit run \
            --from-ref "$FROM_REF" \
            --to-ref HEAD
        shell: bash -l {0}
