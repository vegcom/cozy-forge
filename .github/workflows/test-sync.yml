name: Test Sync

on:
  workflow_dispatch:
    inputs:
      files:
        description: 'Files to test sync (one per line)'
        required: false
        default: |
          .bandit
          .checkov.yaml
          .coveragerc
          .djlint.toml
          .editorconfig
          .envrc
          .eslintignore
          .flake8
          .gitattributes
          .githooks/commit-msg
          .githooks/lib/conda_bootstrap.py
          .githooks/post-checkout
          .githooks/pre-commit
          .githooks/prepare-commit-msg
          .gitignore
          .hadolint.yaml
          .isort.cfg
          .markdownlint.json
          .markdownlintignore
          .pinact.yaml
          .pre-commit-config.yaml
          .prettierignore
          .prettierrc
          .pylintrc
          .pytest.ini
          .ruff.toml
          .shellcheckrc
          .trunk/trunk.yaml
          .yamllint.yaml
          osv-scanner.toml
          .github/linters/.markdownlint.json
  push:
    paths:
      - .github/workflows/notify.yml
      - .github/workflows/receive.yml

jobs:
  test-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger self dispatch
        env:
          GH_TOKEN: ${{ secrets.NOTIFY_TOKEN }}
        run: |
          # Use input if provided, otherwise use default
          if [ -n "${{ github.event.inputs.files }}" ]; then
            files="${{ github.event.inputs.files }}"
          else
            files=$'.bandit\n.checkov.yaml\n.coveragerc\n.djlint.toml\n.editorconfig\n.envrc\n.eslintignore\n.flake8\n.gitattributes\n.githooks/commit-msg\n.githooks/lib/conda_bootstrap.py\n.githooks/post-checkout\n.githooks/pre-commit\n.githooks/prepare-commit-msg\n.gitignore\n.hadolint.yaml\n.isort.cfg\n.markdownlint.json\n.markdownlintignore\n.pinact.yaml\n.pre-commit-config.yaml\n.prettierignore\n.prettierrc\n.pylintrc\n.pytest.ini\n.ruff.toml\n.shellcheckrc\n.trunk/trunk.yaml\n.yamllint.yaml\nosv-scanner.toml\n.github/linters/.markdownlint.json'
          fi

          # Convert newline-separated list into JSON array (trim whitespace)
          json_files=$(echo "$files" | jq -R -s -c 'split("\n") | map(select(length > 0) | gsub("^\\s+|\\s+$"; ""))')

          echo "Testing files: $json_files"

          gh api \
            --method POST \
            /repos/${{ github.repository }}/dispatches \
            -f "event_type=update" \
            -f "client_payload[source]=${{ github.repository }}" \
            -f "client_payload[files]=$json_files" \
            -f "client_payload[test]=true"
