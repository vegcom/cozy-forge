---
# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# Further references:
# - https://github.com/trunk-io/plugins/blob/main/linters/plugin.yaml

# TODO: add Invoke-ScriptAnalyzer for pwsh

version: 0.1
cli:
  version: 1.25.0
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
lint:
  enabled:
    - actionlint@1.7.12
    - bandit@1.9.4
    - checkov@3.3.20
    - git-diff-check
    - grype@0.119.0
    - hadolint@2.15.1
    - isort@9.0.2
    - markdownlint@0.49.1
    - pinact@5.0.0
    - ruff@0.16.9
    - shellcheck@0.11.0
    - taplo@0.10.0
    - trufflehog@3.97.9
    - yamllint@1.38.0
    - psscriptanalyzer
    - osv-scanner
    - prettier
  disabled:
    - black
    - shfmt
  ignore:
    - linters: [yamllint]
      paths:
        - .github/workflows/*.yml
    - linters: [pinact]
      paths:
        - .github/workflows/*.yml
    - linters: [markdownlint]
      paths:
        - .github/PULL_REQUEST_TEMPLATE.md
        - CODE_OF_CONDUCT.md
        - CONTRIBUTING.md
        - SECURITY.md
  definitions:
    - name: shfmt
      commands:
        - name: check
          disable_upstream: true
          files: [shell]
          output: sarif
          read_output_from: stdout
          run: shfmt --apply-ignore --diff ${target}
          success_codes: [0]
        - name: format
          disable_upstream: true
          formatter: true
          output: sarif
          read_output_from: stdout
          run: shfmt --apply-ignore --write ${target}
          success_codes: [0]
    - name: prettier
      commands:
        - name: lint
          disable_upstream: true
          output: sarif
          read_output_from: stdout
          run: prettier --config=${workspace}/.prettierrc --check ${target}
          success_codes: [0]
        - name: format
          disable_upstream: true
          formatter: true
          output: sarif
          read_output_from: stdout
          run: prettier --config=${workspace}/.prettierrc ${target}
          success_codes: [0]
    - name: osv-scanner
      commands:
        - name: lint
          files: [ALL]
          disable_upstream: true
          output: sarif
          read_output_from: stdout
          run: osv-scanner --config=${workspace}/osv-scanner.toml --format=json ${target}
          success_codes: [0]
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - git-lfs
    - trunk-upgrade-available
